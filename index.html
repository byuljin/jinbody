<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 몸 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --paper:#F4F3EE; --ink:#2B3440; --ink-soft:#6B7583; --line:#DDD9CF;
    --plum:#8D5A97; --plum-soft:#EFE4F1;
    --teal:#3E7C74; --coral:#C96F5D; --rose:#F3DEDC; --card:#FCFBF8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Pretendard Variable', 'Pretendard', -apple-system, sans-serif; font-weight:500;
    background:var(--paper); color:var(--ink);
    max-width:520px; margin:0 auto; padding:24px 20px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:600}

  /* status */
  .status{
    display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-soft);
    margin-bottom:16px;padding:7px 11px;background:var(--card);
    border:1px solid var(--line);border-radius:99px;width:fit-content;
  }
  .status .led{width:7px;height:7px;border-radius:50%;background:#C9A227;flex-shrink:0}
  .status.live .led{background:#3E7C74}
  .status.snap .led{background:#C96F5D}

  header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
  header h1{font-family:'Gowun Batang',serif;font-size:21px;font-weight:700;letter-spacing:-0.01em}
  .total-day{font-size:14px;color:var(--ink-soft)}
  .total-day b{font-family:'IBM Plex Mono',monospace;font-size:24px;color:var(--ink);font-weight:700}

  .hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px 20px;margin-bottom:14px}
  .hero .eyebrow{font-size:12px;letter-spacing:0.08em;color:var(--plum);font-weight:600;margin-bottom:6px}
  .hero .eyebrow-row{display:flex;justify-content:space-between;align-items:baseline}
  .hero .today-date{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:0;color:var(--ink-soft)}
  .hero .dday{font-family:'IBM Plex Mono',monospace;font-size:56px;font-weight:700;line-height:1;letter-spacing:-0.03em}
  .hero .last-info{margin-top:8px;font-size:13.5px;color:var(--ink-soft)}
  .hero .last-info b{color:var(--ink);font-weight:600}
  .pace{margin-top:10px;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
  .pace b{color:var(--plum);font-weight:600}

  .dose-track{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
  .dose-track .label{font-size:12px;color:var(--ink-soft);margin-bottom:11px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dot{
    width:44px;height:44px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:-0.03em;
  }
  .dot.d25{background:var(--plum-soft);color:var(--plum)}
  .dot.d50{background:var(--plum);color:#fff}
  .dot.latest{outline:2px solid var(--plum);outline-offset:2.5px}
  .dose-legend{margin-top:12px;font-size:12px;color:var(--ink-soft);display:flex;gap:14px}
  .dose-legend span{display:flex;align-items:center;gap:5px}
  .dose-legend i{display:inline-block;border-radius:50%;width:12px;height:12px}
  .dose-legend .s{background:var(--plum-soft);border:1px solid var(--plum)}
  .dose-legend .l{background:var(--plum)}

  .section-title{font-family:'Gowun Batang',serif;font-size:15px;font-weight:700;margin:26px 2px 12px;display:flex;align-items:baseline;gap:8px}
  .section-title span{font-size:12px;font-weight:400;color:var(--ink-soft);font-family:'Pretendard Variable', 'Pretendard'}

  .delta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .delta{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .delta .k{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:500}
  .delta .v{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;letter-spacing:-0.02em}
  .delta .v em{font-style:normal;font-size:13px;color:var(--ink-soft);font-weight:500;margin-left:3px}
  .delta .now{font-size:12px;color:var(--ink-soft);margin-top:3px;font-family:'IBM Plex Mono',monospace}
  .down{color:var(--teal)} .muscle-flag{color:var(--coral)}

  .cycle-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .cycle-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
  .cycle-card .ck{font-size:12px;color:var(--ink-soft);margin-bottom:5px}
  .cycle-card .cv{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:700;letter-spacing:-0.02em;line-height:1}
  .cycle-trend{text-align:right;font-size:12px;font-weight:600;padding-top:2px}
  .cycle-trend .tlabel{color:var(--ink-soft);font-weight:500;font-size:11px;margin-bottom:3px}
  .cycle-trend.down{color:var(--coral)} .cycle-trend.up{color:var(--teal)} .cycle-trend.flat{color:var(--ink-soft)}
  .cycle-flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:2px 0 9px;
    -webkit-overflow-scrolling:touch;scrollbar-width:thin;scroll-snap-type:x proximity}
  .cycle-flow::-webkit-scrollbar{height:5px}
  .cycle-flow::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
  .cycle-flow::-webkit-scrollbar-track{background:transparent}
  .cycle-step{flex-shrink:0;text-align:center;position:relative;min-width:52px;scroll-snap-align:start}
  .cycle-step .sd{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-bottom:5px}
  .cycle-step .sg{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:700;color:var(--plum);
    background:var(--plum-soft);border-radius:9px;padding:5px 0;margin:0 3px}
  .cycle-step .sg.latest{background:var(--plum);color:#fff}
  .cycle-step .sg.pending{background:var(--plum-soft);border:1.5px dashed #C9AED0;color:#A98FB0;opacity:0.72}
  .cycle-step .sp{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#B58A80;margin-top:4px}
  .cycle-arrow{flex-shrink:0;display:flex;align-items:center;color:var(--line);font-size:12px;padding-bottom:2px}
  .cycle-event{flex-shrink:0;min-width:76px;text-align:center;align-self:center;scroll-snap-align:start}
  .cycle-event .ed{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-bottom:5px}
  .cycle-event .et{font-size:10.5px;font-weight:600;color:var(--coral);border:1px dashed #D7AAA1;border-radius:9px;padding:5px 7px;white-space:nowrap;background:#FFF8F6}
  .cycle-note{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-soft);line-height:1.55}
  .cycle-note b{color:var(--coral);font-weight:600}

  .goal-line{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--ink-soft)}
  .goal-line b{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;color:var(--teal)}
  .goal-line span{opacity:.7;font-size:10.5px}
  .goal-line.done b,.goal-line.done{color:var(--teal);font-weight:600}
  .goal-line.hold b{color:var(--teal)}
  .goal-line.warn b{color:var(--coral)}

  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 14px 10px}
  .range-row{display:flex;gap:6px;padding:0 4px;margin-bottom:12px}
  .range-row button{
    flex:1;font-family:'Pretendard Variable', 'Pretendard';font-weight:600;font-size:12.5px;padding:8px 0;border-radius:10px;
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;
  }
  .range-row button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
  .range-delta{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 6px;margin-bottom:12px;
    background:var(--paper);border-radius:12px;
  }
  .range-delta div{text-align:center}
  .range-delta .rk{font-size:10.5px;color:var(--ink-soft);margin-bottom:3px}
  .range-delta .rv{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;letter-spacing:-0.02em}
  .range-delta .rv.up{color:var(--coral)} .range-delta .rv.dn{color:var(--teal)} .range-delta .rv.flat{color:var(--ink-soft)}
  .chart-tabs{display:flex;gap:6px;margin-bottom:14px;padding:0 4px;flex-wrap:wrap}
  .chart-tabs button{
    font-family:'Pretendard Variable', 'Pretendard';font-weight:500;font-size:12.5px;padding:6px 12px;border-radius:99px;
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;
  }
  .chart-tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chart-wrap{position:relative;height:230px}
  .chart-note{font-size:11.5px;color:var(--ink-soft);padding:10px 6px 6px;display:flex;gap:12px;flex-wrap:wrap}
  .chart-note span{display:flex;align-items:center;gap:5px}
  .chart-note i.inj{width:2px;height:11px;background:var(--plum);display:inline-block}
  .chart-note i.per{width:11px;height:11px;background:var(--rose);display:inline-block;border-radius:3px}
  .chart-note i.ma{width:14px;height:0;border-top:2px dashed var(--ink-soft);display:inline-block}

  .badges{display:flex;flex-direction:column;gap:8px}
  .badge{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px}
  .badge.locked{opacity:.45}
  .badge .medal{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:var(--plum-soft);display:flex;align-items:center;justify-content:center;font-size:16px}
  .badge.locked .medal{background:#E8E6DF}
  .badge .t{font-size:13.5px;font-weight:500}
  .badge .d{font-size:11.5px;color:var(--ink-soft);margin-top:1px;font-family:'IBM Plex Mono',monospace}


  .loading{text-align:center;padding:60px 0;color:var(--ink-soft);font-size:13px}
  footer{margin-top:34px;text-align:center;font-size:11.5px;color:var(--ink-soft);line-height:1.7}
  #app{display:none}
</style>
</head>
<body>

<div class="loading" id="loading">데이터를 불러오는 중…</div>

<div id="app">
  <div class="status" id="status"><span class="led"></span><span id="statusText">확인 중</span></div>

  <header>
    <h1>나의 몸 기록</h1>
    <div class="total-day">마운자로 <b id="totalDay">–</b>일차</div>
  </header>

  <div class="hero">
    <div class="eyebrow eyebrow-row"><span>마지막 투여로부터</span><span class="today-date" id="todayDate"></span></div>
    <div class="dday num" id="dday">–</div>
    <div class="last-info" id="lastInfo"></div>
    <div class="pace" id="pace"></div>
    <div class="dose-track">
      <div class="label"><span>투여 이력</span><span class="num" id="doseSummary"></span></div>
      <div class="dots" id="doseDots"></div>
      <div class="dose-legend">
        <span><i class="s"></i>2.5mg</span>
        <span><i class="l"></i>5mg</span>
      </div>
    </div>
  </div>

  <div class="section-title">시작 대비 변화 <span id="rangeLabel"></span></div>
  <div class="delta-grid" id="deltaGrid"></div>

  <div class="section-title">추이</div>
  <div class="chart-card">
    <div class="range-row" id="rangeBtns"></div>
    <div class="range-delta" id="rangeDelta"></div>
    <div class="chart-tabs" id="chartTabs"></div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
    <div class="chart-note">
      <span><i class="inj"></i>투여일</span>
      <span><i class="per"></i>생리 기간</span>
      <span><i class="ma"></i>7일 평균</span>
    </div>
  </div>


  <div class="section-title">생리 주기 <span>주기 변화 추적</span></div>
  <div class="cycle-card">
    <div class="cycle-top">
      <div>
        <div class="ck">마지막 시작으로부터</div>
        <div class="cv num" id="cycleDday">–</div>
      </div>
      <div class="cycle-trend" id="cycleTrend"></div>
    </div>
    <div class="cycle-flow" id="cycleFlow"></div>
    <div class="cycle-note" id="cycleNote"></div>
  </div>

  <footer id="footer"></footer>
</div>

/* ================= 유틸 ================= */
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const md=s=>{const[,m,d]=s.split('-');return `${+m}/${+d}`};
const fatPct=r=>(r.weight&&r.fat)?+(r.fat/r.weight*100).toFixed(2):null;
const bmi=r=>r.weight?+(r.weight/H2).toFixed(2):null;
const sign=v=>(v>0?'+':'−')+Math.abs(v).toFixed(1);

/* ================= 데이터 로드 ================= */
async function load(){
  try{
    const res=await fetch(API,{redirect:'follow'});
    const j=await res.json();
    if(j&&j.ok&&Array.isArray(j.data)&&j.data.length) return {rows:j.data,live:true};
    throw new Error('bad payload');
  }catch(err){
    return {rows:SNAPSHOT,live:false,err:String(err)};
  }
}

let ALL_DATA=[],DATA=[],LIVE=false,chart=null,currentMetric='weight',currentRange='all',METRICS={},injIdx=[],periodRuns=[];

  const n50=injections.filter(r=>r.dose===5).length;

  document.getElementById('dday').textContent='D+'+daysBetween(lastInj.date,today);
  const wd=['일','월','화','수','목','금','토'][parse(lastInj.date).getDay()];
  document.getElementById('lastInfo').innerHTML=
    `<b>${md(lastInj.date)} (${wd}) · ${lastInj.dose}mg</b> · ${injections.length}회차`;

  /* 평균 간격 (불규칙 투여이므로 의미 있음) */
  const gaps=[];
  for(let i=1;i<injections.length;i++) gaps.push(daysBetween(injections[i-1].date,injections[i].date));
  const avg=gaps.reduce((a,b)=>a+b,0)/gaps.length;
  const since=daysBetween(lastInj.date,today);
  const diff=since-avg;
  document.getElementById('pace').innerHTML=
    `평균 투여 간격 <b>${avg.toFixed(1)}일</b> · 지금은 평균보다 `+

  document.getElementById('doseSummary').textContent=
    `총 ${injections.length}회 — 2.5mg ×${n25} · 5mg ×${n50}`;

  const dots=document.getElementById('doseDots');
  injections.forEach((r,i)=>{
    const el=document.createElement('div');
    el.className='dot '+(r.dose===5?'d50':'d25')+(i===injections.length-1?' latest':'');
    el.textContent=md(r.date);
    el.title=`${i+1}회차 · ${r.dose}mg`;
    dots.appendChild(el);
  });

  /* --- 변화 카드 (목표 포함) --- */
  document.getElementById('rangeLabel').textContent=`${md(first.date)} → ${md(last.date)} 기준`;

  const FAT_GOAL=+(GOAL_W*0.25).toFixed(1);   // 목표체중 × 25%

  const cards=[
    {k:'체중',    v:last.weight-first.weight, u:'kg', a:first.weight, b:last.weight, cls:'down',
     goal:{type:'down', now:last.weight, target:GOAL_W, label:GOAL_W+'kg', u:'kg'}},
    {k:'체지방률', v:fatPct(last)-fatPct(first), u:'%p', a:fatPct(first), b:fatPct(last), cls:'down',
     goal:{type:'down', now:fatPct(last), target:25, label:'25%', u:'%p'}},
    {k:'체지방량', v:last.fat-first.fat, u:'kg', a:first.fat, b:last.fat, cls:'down',
     goal:{type:'down', now:last.fat, target:FAT_GOAL, label:FAT_GOAL+'kg', u:'kg'}},

  const grid=document.getElementById('deltaGrid');
  cards.forEach(c=>{
    let goalLine='';
    if(c.goal){

      if(g.type==='down'){

          ? `<div class="goal-line done">🎯 목표 달성!</div>`

      }else if(g.type==='hold'){
        goalLine = g.now>=g.line
          ? `<div class="goal-line hold">💪 <b>${g.line}kg</b> <span>지키는 중</span></div>`

    }
    grid.insertAdjacentHTML('beforeend',
      `<div class="delta"><div class="k">${c.k}</div>

       <div class="now num">${(+c.a).toFixed(1)} → ${(+c.b).toFixed(1)}</div>${goalLine}</div>`);
  });

  // 기초대사량 (Katch-McArdle) — 최근 7일 평균 제지방량 기준
  const recent7=DATA.slice(-7).filter(r=>r.weight&&r.fat!=null);
  let bmrHtml=`<div class="delta"><div class="k">기초대사량</div>
     <div class="v num" style="font-size:20px;padding-top:2px">–</div></div>`;

    const avgW=recent7.reduce((a,r)=>a+r.weight,0)/recent7.length;
    const avgF=recent7.reduce((a,r)=>a+r.fat,0)/recent7.length;
    const lbm=avgW-avgF;
    const bmr=Math.round(370+21.6*lbm);
    bmrHtml=`<div class="delta"><div class="k">기초대사량</div>

       <div class="now num">제지방량 ${lbm.toFixed(1)}kg · 7일평균</div></div>`;
  }
  grid.insertAdjacentHTML('beforeend', bmrHtml);

  /* --- 차트 --- */
  METRICS={
    weight:{label:'체중 (kg)',   data:DATA.map(r=>r.weight), color:'#2B3440'},
    fatp:  {label:'체지방률 (%)', data:DATA.map(fatPct),      color:'#C96F5D'},
    muscle:{label:'골격근량 (kg)',data:DATA.map(r=>r.muscle), color:'#3E7C74'},
    fat:   {label:'체지방량 (kg)',data:DATA.map(r=>r.fat),    color:'#C96F5D'},
    bmi:   {label:'BMI',         data:DATA.map(bmi),         color:'#8D5A97',
            zones:[{v:25,t:'비만 경계'},{v:23,t:'정상 상한'}]}
  };
  injIdx=DATA.map((r,i)=>r.dose?i:-1).filter(i=>i>=0);

  /* 생리: 연속 구간별로 묶기 */
  periodRuns=[]; let run=null;
  DATA.forEach((r,i)=>{
    if(r.period){ if(!run) run={s:i,e:i}; else run.e=i; }
    else if(run){ periodRuns.push(run); run=null; }
  });
  if(run) periodRuns.push(run);

  /* 생리 주기: 시작일 추출 (10일 이내 재등장은 같은 주기로 병합) */
  renderCycle(today);

  const tabs=document.getElementById('chartTabs');
  [['weight','체중'],['fatp','체지방률'],['muscle','골격근량'],['fat','체지방량'],['bmi','BMI']]
    .forEach(([k,label],i)=>{

    b.textContent=label; b.dataset.r=k;

function esc(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}

/* --- 생리 주기 (평균 없이 변화 흐름 중심) --- */

function renderCycle(today){
  /* 시트의 생리 표시를 회차별 구간으로 묶는다. 측정이 비는 날은 10일 이내면 같은 회차로 본다. */
  const liveDays=ALL_DATA.filter(r=>r.period).map(r=>r.date).sort();
  const liveRanges=[];
  let range=null;
  liveDays.forEach(d=>{
    if(!range || daysBetween(range.end,d)>10){
      if(range) liveRanges.push(range);
      range={start:d,end:d,source:'sheet'};
    }else{
      range.end=d;
    }
  });
  if(range) liveRanges.push(range);

  /* 명시적으로 받은 과거 기록과 시트 기록을 합치고, 같은 시작일은 시트 기록을 우선한다. */
  const rangeMap=new Map();
  CYCLE_HISTORY.forEach(r=>rangeMap.set(r.start,{...r,ended:true,source:'history'}));
  liveRanges.forEach((r,i)=>{
    const hasLaterStart=i<liveRanges.length-1;
    const endedByRow=ALL_DATA.some(x=>x.date>r.end && !x.period);
    rangeMap.set(r.start,{...r,ended:hasLaterStart||endedByRow,source:'sheet'});
  });
  const ranges=[...rangeMap.values()].sort((a,b)=>a.start.localeCompare(b.start));
  if(!ranges.length){ document.getElementById('cycleDday').textContent='기록 없음'; return; }

  const last=ranges[ranges.length-1].start;
  const since=daysBetween(last,today);
  document.getElementById('cycleDday').innerHTML=`D+${since}`;

  /* 간격 숫자는 새로 시작한 날짜 아래에 붙인다. */
  const entries=ranges.map((r,i)=>({
    ...r,
    gap:i===0?null:daysBetween(ranges[i-1].start,r.start),
    duration:daysBetween(r.start,r.end)+1
  }));
  const cycles=entries.slice(1).map((r,i)=>({
    from:entries[i].start,to:r.start,gap:r.gap
  }));

  /* 생리 회차와 미레나 제거 같은 사건을 한 타임라인에 함께 배치한다. */
  const timeline=[
    ...entries.map((entry,i)=>({type:'cycle',date:entry.start,entry,isLast:i===entries.length-1})),
    ...CYCLE_EVENTS.map(event=>({type:'event',date:event.date,event}))
  ].sort((a,b)=>a.date.localeCompare(b.date));

  const flow=document.getElementById('cycleFlow');
  let html='';
  timeline.forEach((item,i)=>{
    if(item.type==='event'){
      html+=`<div class="cycle-event">
        <div class="ed">${md(item.event.date)}</div>
        <div class="et">${esc(item.event.label)}</div>
      </div>`;
    }else{
      const entry=item.entry;
      const duration=entry.ended?`${entry.duration}일간`:`${entry.duration}일 기록`;
      // 기록된 주기는 모두 확정(또렷) 표시. 첫 기록만 간격이 없다.
      const gapLabel=entry.gap===null?'첫 기록':`${entry.gap}일`;
      html+=`<div class="cycle-step">
        <div class="sd">${md(entry.start)}</div>
        <div class="sg">${gapLabel}</div>
        <div class="sp">${duration}</div>
      </div>`;
    }
    if(i<timeline.length-1) html+=`<div class="cycle-arrow">›</div>`;
  });

  // 마지막 기록 뒤에, 아직 오지 않은 다음 생리를 기다리는 미확정 칸을 덧붙인다.
  const lastStart=entries[entries.length-1].start;
  const sinceLast=daysBetween(lastStart,today);
  html+=`<div class="cycle-arrow">›</div>
    <div class="cycle-step">
      <div class="sd">다음</div>
      <div class="sg pending">D+${sinceLast}</div>
      <div class="sp"></div>
    </div>`;

  flow.innerHTML=html;
  requestAnimationFrame(()=>{ flow.scrollLeft=flow.scrollWidth; });

  /* 추세 표시 (최근 3개 간격 방향) */
  const trendEl=document.getElementById('cycleTrend');
  if(cycles.length>=2){
    const recent=cycles.slice(-3).map(c=>c.gap);
    const first=recent[0], lastGap=recent[recent.length-1];
    const diff=lastGap-first;
    let cls,arrow,word;
    if(diff<=-2){cls='down';arrow='↓';word='짧아지는 중';}
    else if(diff>=2){cls='up';arrow='↑';word='길어지는 중';}
    else{cls='flat';arrow='→';word='비슷하게 유지';}
    trendEl.className='cycle-trend '+cls;
    trendEl.innerHTML=`<div class="tlabel">최근 추세</div>${arrow} ${word}`;

    const gaps=cycles.map(c=>c.gap);
    const noteEl=document.getElementById('cycleNote');
    if(cls==='down'){
      noteEl.innerHTML=`간격이 <b>${gaps[0]}일 → ${lastGap}일</b>로 짧아지는 흐름이에요. 체지방이 빠르게 줄면서 나타날 수 있는 변화예요. 진료 때 참고가 될 수 있어요.`;
    }else if(cls==='up'){
      noteEl.innerHTML=`간격이 <b>${gaps[0]}일 → ${lastGap}일</b>로 길어지는 흐름이에요.`;
    }else{
      noteEl.innerHTML=`최근 간격이 <b>${Math.min(...recent)}~${Math.max(...recent)}일</b>로 비슷하게 유지되고 있어요.`;
    }
  }else{
    trendEl.innerHTML='';
    document.getElementById('cycleNote').innerHTML=
      `마지막 시작 <b>${md(last)}</b> · 간격 비교는 2회차부터 보여요.`;
  }
}
/* --- 차트 그리기 --- */
let viewInj=[],viewPeriod=[];
const markerPlugin={
  id:'markers',
  beforeDatasetsDraw(c){
    const {ctx,chartArea:{top,bottom,left,right},scales:{x,y}}=c;
    ctx.save(); ctx.fillStyle='#F3DEDC';
    viewPeriod.forEach(run=>{
      const x0=x.getPixelForValue(run.s)-2, x1=x.getPixelForValue(run.e)+2;
      ctx.fillRect(x0,top,Math.max(x1-x0,3),bottom-top);
    });
    ctx.restore();

    const zones=METRICS[currentMetric].zones;
    if(zones){
      ctx.save();
      zones.forEach(z=>{
        const py=y.getPixelForValue(z.v);
        if(py<top||py>bottom) return;
        ctx.strokeStyle='rgba(43,52,64,0.35)'; ctx.setLineDash([5,4]); ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(left,py); ctx.lineTo(right,py); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle='rgba(43,52,64,0.55)';
        ctx.font='10px Pretendard'; ctx.textAlign='right';
        ctx.fillText(z.t+' '+z.v, right-4, py-4);
      });
      ctx.restore();
    }

    ctx.save(); ctx.strokeStyle='rgba(141,90,151,0.55)'; ctx.lineWidth=1.5;
    viewInj.forEach(i=>{
      const px=x.getPixelForValue(i);
      ctx.beginPath(); ctx.moveTo(px,top); ctx.lineTo(px,bottom); ctx.stroke();
    });
    ctx.restore();
  }
};

/* --- 기간 슬라이스 + 7일 이동평균 --- */
function sliceByRange(){
  if(currentRange==='all') return {rows:DATA,offset:0};
  const days=currentRange==='1m'?30:90;
  const lastDate=DATA[DATA.length-1].date;
  const cut=new Date(parse(lastDate).getTime()-days*86400000);
  let i=DATA.findIndex(r=>parse(r.date)>=cut);
  if(i<0) i=0;
  return {rows:DATA.slice(i),offset:i};
}

function movingAvg(vals,win){
  return vals.map((_,i)=>{
    const s=[];
    for(let j=Math.max(0,i-win+1);j<=i;j++) if(vals[j]!=null) s.push(vals[j]);
    return s.length? +(s.reduce((a,b)=>a+b,0)/s.length).toFixed(2) : null;
  });
}

function renderRangeDelta(rows){
  const f=rows[0], l=rows[rows.length-1];
  const items=[
    {k:'체중', v:l.weight-f.weight, u:'kg'},
    {k:'체지방률', v:fatPct(l)-fatPct(f), u:'%p'},
    {k:'체지방량', v:l.fat-f.fat, u:'kg'},
    {k:'골격근량', v:l.muscle-f.muscle, u:'kg'}
  ];
  document.getElementById('rangeDelta').innerHTML=items.map(it=>{
    const cls=Math.abs(it.v)<0.05?'flat':(it.v<0?'dn':'up');
    return `<div><div class="rk">${it.k}</div><div class="rv ${cls}">${sign(it.v)}</div></div>`;
  }).join('');
}

function draw(key){
  currentMetric=key;
  const m=METRICS[key];
  const {rows,offset}=sliceByRange();

  renderRangeDelta(rows);

  // 전체 시리즈로 MA를 구한 뒤 창에 맞게 잘라야 왼쪽 끝도 정확함
  const fullVals=m.data;
  const ma=movingAvg(fullVals,7).slice(offset);
  const vals=fullVals.slice(offset);

  // 마커 인덱스를 창 기준으로 재계산
  viewInj=injIdx.map(i=>i-offset).filter(i=>i>=0);
  viewPeriod=periodRuns.map(r=>({s:r.s-offset,e:r.e-offset}))
                       .filter(r=>r.e>=0)
                       .map(r=>({s:Math.max(r.s,0),e:r.e}));

  if(chart) chart.destroy();
  chart=new Chart(document.getElementById('chart'),{
    type:'line',
    data:{labels:rows.map(r=>md(r.date)),datasets:[
      {label:m.label,data:vals,borderColor:m.color,borderWidth:2,
       pointRadius:0,pointHitRadius:12,tension:0.25,spanGaps:true},
      {label:'7일 평균',data:ma,borderColor:'rgba(107,117,131,0.75)',borderWidth:1.5,
       borderDash:[5,4],pointRadius:0,pointHitRadius:0,tension:0.3,spanGaps:true}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'#2B3440',
        titleFont:{family:'IBM Plex Mono'},bodyFont:{family:'IBM Plex Mono'}
      }},
      scales:{
        x:{ticks:{maxTicksLimit:6,font:{family:'IBM Plex Mono',size:10},color:'#6B7583'},grid:{display:false}},
        y:{ticks:{font:{family:'IBM Plex Mono',size:10},color:'#6B7583'},grid:{color:'#EAE7DE'}}
      }
    },
    plugins:[markerPlugin]
  });
}


/* ================= 시작 ================= */
load().then(render);
</script>
